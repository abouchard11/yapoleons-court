<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="Yapoleon's Court — Charm the AI Emperor">
  <!-- Social / link-preview card (1200x630). Brand tokens from src/index.css:
       navy #1B2A4A · gold #E8B84B · crimson #C8302A · cream #FBF6EC.
       Type is rendered with a heavy system grotesque so the rasterizer (rsvg)
       needs no embedded webfont; the look approximates the app's Bricolage. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24365A"/>
      <stop offset="1" stop-color="#1B2A4A"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#E8B84B" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- imperial double-rule frame -->
  <rect x="26" y="26" width="1148" height="578" rx="16" fill="none" stroke="#E8B84B" stroke-width="2" opacity="0.9"/>
  <rect x="40" y="40" width="1120" height="550" rx="10" fill="none" stroke="#E8B84B" stroke-width="1" opacity="0.45"/>

  <!-- crown -->
  <g transform="translate(525,70) scale(1.5)">
    <path d="M6 72 L6 52 L18 10 L34 44 L50 2 L66 44 L82 10 L94 52 L94 72 Z" fill="#E8B84B"/>
    <circle cx="18" cy="10" r="6" fill="#E8B84B"/>
    <circle cx="50" cy="3" r="7" fill="#E8B84B"/>
    <circle cx="82" cy="10" r="6" fill="#E8B84B"/>
    <circle cx="50" cy="60" r="6" fill="#C8302A"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="320" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700"
        font-size="86" fill="#FBF6EC" style="letter-spacing:3px">YAPOLEON&#8217;S COURT</text>

  <!-- divider with centre diamond -->
  <line x1="470" y1="360" x2="565" y2="360" stroke="#E8B84B" stroke-width="1.5" opacity="0.8"/>
  <line x1="635" y1="360" x2="730" y2="360" stroke="#E8B84B" stroke-width="1.5" opacity="0.8"/>
  <rect x="591" y="351" width="18" height="18" rx="2" transform="rotate(45 600 360)" fill="#E8B84B"/>

  <!-- tagline -->
  <text x="600" y="420" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400"
        font-size="31" fill="#E9E2CF" style="letter-spacing:0.3px">Charm the AI emperor. Win his favor in three lines.</text>

  <!-- favor meter -->
  <text x="300" y="478" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="19" fill="#E8B84B" style="letter-spacing:3px">FAVOR</text>
  <rect x="300" y="490" width="600" height="20" rx="10" fill="#24365A" stroke="#E8B84B" stroke-width="1.25" opacity="0.95"/>
  <rect x="300" y="490" width="510" height="20" rx="10" fill="#E8B84B"/>
  <!-- goal marker: the meter fills toward the crown (favor won at 100) -->
  <g transform="translate(876,468) scale(0.24)">
    <path d="M6 72 L6 52 L18 10 L34 44 L50 2 L66 44 L82 10 L94 52 L94 72 Z" fill="#E8B84B"/>
    <circle cx="18" cy="10" r="6" fill="#E8B84B"/>
    <circle cx="50" cy="3" r="7" fill="#E8B84B"/>
    <circle cx="82" cy="10" r="6" fill="#E8B84B"/>
    <circle cx="50" cy="60" r="6" fill="#C8302A"/>
  </g>

  <!-- url -->
  <text x="600" y="566" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600"
        font-size="25" fill="#E8B84B" style="letter-spacing:4px">court.yapoleon.com</text>
</svg>
